<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sohoz Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F8FA;--sf:#fff;--ink:#14263F;--mu:#55657A;--ln:#D9E1E8;--jd:#0E8F6E;--jk:#fff;--sun:#F2B632;--hero:#14263F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1522;--sf:#14223A;--ink:#EAF0F6;--mu:#9DB0C4;--ln:#26385A;--jd:#2CC59B;--jk:#06251D;--hero:#0A1930;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1522;--sf:#14223A;--ink:#EAF0F6;--mu:#9DB0C4;--ln:#26385A;--jd:#2CC59B;--jk:#06251D;--hero:#0A1930;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;min-height:64px}
.logo{font-weight:700;font-size:23px}.logo b{color:var(--jd)}
.burger{display:none;background:none;border:1px solid var(--ln);border-radius:8px;color:var(--ink);font-size:20px;width:42px;height:40px}
#menu{display:flex;align-items:center;gap:26px;flex:1;justify-content:flex-end}
nav{display:flex;gap:22px;margin-right:auto;margin-left:30px}
nav a{padding:6px 0;font-weight:500;border-bottom:2px solid transparent}
nav a[aria-current]{border-color:var(--jd);color:var(--jd)}
.act{display:flex;gap:10px;align-items:center}
.btn,.ghost,.lang{border-radius:10px;padding:9px 18px;font-weight:600;border:1px solid transparent;min-height:42px}
.btn{background:var(--jd);color:var(--jk)}
.ghost{background:none;border-color:var(--ln);color:var(--ink)}
.lang{background:var(--sun);color:#14263F;border-radius:999px}
.hero{background:var(--hero);color:#fff;padding:52px 0 60px}
.hero .wrap{display:grid;gap:36px;grid-template-columns:1.3fr 1fr;align-items:center}
.hero h1{font-size:clamp(32px,6vw,54px);line-height:1.2;margin:0 0 14px}
.hero p{font-size:19px;color:#C9D6E6;margin:0 0 26px;max-width:520px}
.hero .btn{background:var(--sun);color:#14263F}
.hero .ghost{color:#fff;border-color:#4A6082}
.row{display:flex;gap:12px;flex-wrap:wrap}
.mock{background:var(--sf);color:var(--ink);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.mock small{color:var(--mu)}.mock h4{margin:4px 0 12px;font-size:19px}
.pb{height:10px;border-radius:9px;background:var(--ln);overflow:hidden}.pb i{display:block;height:100%;width:40%;background:var(--jd)}
.strip{background:var(--sf);border-bottom:1px solid var(--ln)}
.strip .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:16px 20px;font-weight:600}
.strip span::before{content:"✓ ";color:var(--jd)}
section{padding:46px 0}
h2{font-size:clamp(24px,4.5vw,33px);margin:0 0 6px}
.sub{color:var(--mu);margin:0 0 24px}
.hd{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.hd h2{margin:0}.hd a{color:var(--jd);font-weight:600}
.g{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.cat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px;font-weight:600;display:flex;gap:12px;align-items:center}
.cat i{font-style:normal;font-size:26px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.th{height:120px;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,hsl(var(--h) 55% 40%),hsl(var(--h) 55% 26%));position:relative}
.tag{position:absolute;top:10px;left:10px;font-size:14px;font-weight:600;padding:1px 12px;border-radius:999px;background:var(--sun);color:#14263F}
.tag.p{background:#fff;color:#0A5C47}
.cb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb small{color:var(--mu)}.cb h3{margin:0;font-size:19px;line-height:1.35}
.cb .row{margin-top:auto;padding-top:10px;align-items:center;justify-content:space-between}
.pr{font-weight:700;font-size:20px}
.stp{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px}
.stp b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--jd);color:var(--jk);margin-bottom:8px}
.stp h3{margin:0;font-size:19px}
.alt{background:var(--sf);border-block:1px solid var(--ln)}
details{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.alt details{background:var(--bg)}
summary{font-weight:600;cursor:pointer}details p{margin:8px 0 0;color:var(--mu)}
.cta{background:var(--jd);color:var(--jk);text-align:center;padding:44px 0}
.cta h2{margin-bottom:16px}.cta .btn{background:#fff;color:#0A5C47}
.flt{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.flt button{background:var(--sf);border:1px solid var(--ln);color:var(--ink);border-radius:999px;padding:7px 18px}
.flt button.on{background:var(--jd);color:var(--jk);border-color:var(--jd)}
.pg{max-width:680px}.pg p{color:var(--mu)}
footer{background:var(--hero);color:#C9D6E6;padding:44px 0 24px}
.fg{display:grid;gap:28px;grid-template-columns:1.6fr 1fr 1fr 1fr}
footer h4{color:#fff;margin:0 0 8px}footer p,footer li{margin:0 0 6px}footer ul{list-style:none;margin:0;padding:0}
footer .logo{color:#fff;display:block;margin-bottom:8px}
footer .cp{border-top:1px solid #2B3F5E;margin-top:26px;padding-top:16px;font-size:15px}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--ink);padding:24px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.x{float:right;background:none;border:0;color:var(--mu);font-size:20px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1;background:none;border:0;border-bottom:3px solid var(--ln);color:var(--mu);padding:8px;font-weight:600}
.tabs button.on{border-color:var(--jd);color:var(--ink)}
label{display:block;margin-bottom:12px;font-weight:500}
input,select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-top:4px}
#msg{color:var(--mu);margin:10px 0 0}
@media(max-width:860px){
.burger{display:block}
#menu{display:none;flex-direction:column;align-items:stretch;width:100%;gap:10px;padding-bottom:14px}
#menu.open{display:flex}
nav{flex-direction:column;margin:0;gap:4px}
.act{flex-wrap:wrap}
.hero .wrap,.fg{grid-template-columns:1fr}
}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL="https://yrdscpfzoisubgfokfib.supabase.co";

(function(){

var C=[
["Online Business Mastery","অনলাইন বিজনেস মাস্টারি",1,0],
["Online Business Basics","অনলাইন ব্যবসার প্রাথমিক ধারণা",0,0],
["Find Your First Product","আপনার প্রথম পণ্য খুঁজুন",0,0],
["Freelancing for Beginners","ফ্রিল্যান্সিং শুরু করুন",1,1],
["Facebook Marketing Basics","ফেসবুক মার্কেটিং বেসিক",0,2],
["Spoken English Starter","স্পোকেন ইংলিশ শুরু",1,3]];
function norm(){return live&&live.length?live:C.map(function(c){return {e:c[0],b:c[1],price:c[2]?1:0,k:c[3]};});}
function card(c){var k=CATS[c.k],p=c.price>0,have=c.id&&mine.indexOf(c.id)>-1;
return '<article class="card"><div class="th" style="--h:'+k[3]+'" aria-hidden="true">'+k[0]+'<span class="tag'+(p?' p':'')+'">'+(p?T("Paid","পেইড"):T("Free","ফ্রি"))+'</span></div><div class="cb"><small>'+T(k[1],k[2])+'</small><h3>'+T(c.e,c.b)+'</h3><div class="row"><span class="pr">'+(p?(c.id?"৳ "+c.price:"৳ 0,000"):T("Free","ফ্রি"))+'</span>'+(have?'<span style="color:var(--jd);font-weight:600">✓ '+T("Enrolled","ভর্তি আছেন")+'</span>':'<button class="btn" data-a="enroll" data-id="'+(c.id||"")+'">'+(p?T("Enroll","ভর্তি হোন"):T("Start free","ফ্রি শুরু"))+'</button>')+'</div></div></article>';}
function view(){var h=location.hash.slice(1);return h==="courses"||h==="about"||h==="contact"||h==="dashboard"?h:"home";}
function dashboard(){
var h='<section><div class="wrap"><h2>'+T("My Courses","আমার কোর্স")+'</h2>';
if(!user)return h+'<p class="sub">'+T("Please log in to see your courses.","আপনার কোর্স দেখতে লগইন করুন।")+'</p><button class="btn" data-a="login">'+T("Log in","লগইন")+'</button></div></section>';
var my=norm().filter(function(c){return c.id&&mine.indexOf(c.id)>-1;});
return h+'<p class="sub">'+T("Welcome back.","স্বাগতম।")+'</p>'+(my.length?'<div class="g">'+my.map(card).join("")+'</div>':'<p>'+T("You have no courses yet. Start with a free course.","আপনার এখনো কোনো কোর্স নেই। একটি ফ্রি কোর্স দিয়ে শুরু করুন।")+'</p><a class="btn" href="#courses">'+T("Browse courses","কোর্স দেখুন")+'</a>')+'</div></section>';}
function payHTML(){
return '<button class="x" data-a="close" aria-label="Close">✕</button><h3 style="margin:0 0 8px">'+T(pay.e,pay.b)+' · ৳ '+pay.price+'</h3><p>'+T("Enter your mobile number. You will go to the secure payment page (bKash, Nagad, Rocket, card).","আপনার মোবাইল নম্বর দিন। এরপর নিরাপদ পেমেন্ট পেজে যাবেন (বিকাশ, নগদ, রকেট, কার্ড)।")+'</p><label>'+T("Mobile number","মোবাইল নম্বর")+'<input type="tel" placeholder="01XXXXXXXXX" autocomplete="tel"></label><button class="btn" style="width:100%" data-a="submit">'+T("Pay now","এখনই পেমেন্ট করুন")+'</button><p id="msg"></p>';}
function doSubmit(){
var d=document.getElementById("dlg"),ins=d.querySelectorAll("input"),msg=d.querySelector("#msg");
if(!sb){msg.textContent=T("Not connected yet. Add the Supabase keys in index.html.","এখনো সংযুক্ত নয়। index.html-এ Supabase কী যোগ করুন।");return;}
if(pay){var ph=ins[0].value.trim();msg.textContent="…";
sb.auth.getSession().then(function(x){var t=x.data.session&&x.data.session.access_token;
return fetch("/api/pay",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({course_id:pay.id,phone:ph})});})
.then(function(r){return r.json();}).then(function(j){if(j.url){location.href=j.url;}else{msg.textContent=j.error||T("Payment error.","পেমেন্টে সমস্যা।");}})
.catch(function(){msg.textContent=T("Network error.","নেটওয়ার্ক সমস্যা।");});return;}
var l=mode==="login",em=ins[l?0:1].value.trim(),pw=ins[l?1:2].value;
var p=l?sb.auth.signInWithPassword({email:em,password:pw}):sb.auth.signUp({email:em,password:pw,options:{data:{full_name:ins[0].value.trim()}}});
msg.textContent="…";
p.then(function(r){if(r.error){msg.textContent=r.error.message;return;}
if(!l&&!r.data.session){msg.textContent=T("Check your email to confirm your account.","অ্যাকাউন্ট নিশ্চিত করতে আপনার ইমেইল দেখুন।");return;}
d.close();});}
function loadData(){if(!sb)return;
sb.from("courses").select("id,slug,title_en,title_bn,category,price").eq("published",true).order("created_at").then(function(r){
if(!r.error&&r.data&&r.data.length){live=r.data.map(function(c){var k=0;CATS.forEach(function(x,i){if(x[1]===c.category)k=i;});return {id:c.id,e:c.title_en,b:c.title_bn,price:c.price,k:k};});}
if(!user){mine=[];return;}
return sb.from("enrollments").select("course_id").then(function(q){mine=q.data?q.data.map(function(x){return x.course_id;}):[];});
}).then(render);}
function home(){

var st=[["Create a free account","ফ্রি অ্যাকাউন্ট খুলুন"],["Pick a course","কোর্স বেছে নিন"],["Learn and get your certificate","শিখুন ও সার্টিফিকেট নিন"]];
return '<div class="hero"><div class="wrap"><div><h1>'+T("Learn online, the easy way.","সহজে অনলাইনে শিখুন।")+'</h1><p>'+T("Free and paid courses in Bangla and English. Learn at your own pace, from your phone or computer.","বাংলা ও ইংরেজিতে ফ্রি ও পেইড কোর্স। আপনার সময়মতো, ফোন বা কম্পিউটার থেকে শিখুন।")+'</p><div class="row"><a class="btn" href="#courses">'+T("Browse courses","কোর্স দেখুন")+'</a><button class="ghost" data-a="signup">'+T("Start free","ফ্রি শুরু করুন")+'</button></div></div><div class="mock" aria-hidden="true"><small>'+T("My learning","আমার শেখা")+'</small><h4>'+T(norm()[0].e,norm()[0].b)+'</h4><div class="pb"><i></i></div></div></div></div>'
+'<div class="strip"><div class="wrap"><span>'+T("Free courses to start","শুরু করতে ফ্রি কোর্স")+'</span><span>'+T("Bangla and English","বাংলা ও ইংরেজি")+'</span><span>'+T("bKash, Nagad, card","বিকাশ, নগদ, কার্ড")+'</span><span>'+T("Certificate on finish","শেষে সার্টিফিকেট")+'</span></div></div>'
+'<section><div class="wrap"><h2>'+T("Browse by topic","বিষয় অনুযায়ী খুঁজুন")+'</h2><p class="sub">'+T("Pick what you want to learn.","যা শিখতে চান তা বেছে নিন।")+'</p><div class="g">'+CATS.map(function(k){return '<a class="cat" href="#courses"><i>'+k[0]+'</i>'+T(k[1],k[2])+'</a>';}).join("")+'</div></div></section>'
+'<section class="alt"><div class="wrap"><div class="hd"><h2>'+T("Popular courses","জনপ্রিয় কোর্স")+'</h2><a href="#courses">'+T("See all courses","সব কোর্স দেখুন")+'</a></div><div class="g">'+norm().slice(0,3).map(card).join("")+'</div></div></section>'
+'<section><div class="wrap"><h2>'+T("How it works","কীভাবে কাজ করে")+'</h2><p class="sub">'+T("Three easy steps.","মাত্র তিনটি সহজ ধাপ।")+'</p><div class="g">'+st.map(function(x,i){return '<div class="stp"><b>'+(i+1)+'</b><h3>'+T(x[0],x[1])+'</h3></div>';}).join("")+'</div></div></section>'
+'<section class="alt"><div class="wrap pg"><h2>'+T("Questions","সাধারণ প্রশ্ন")+'</h2><p class="sub"></p>'+q.map(function(x){return '<details><summary>'+T(x[0],x[1])+'</summary><p>'+T(x[2],x[3])+'</p></details>';}).join("")+'</div></section>'

var b=[["all","All","সব"],["free","Free","ফ্রি"],["paid","Paid","পেইড"]];
return '<section><div class="wrap"><h2>'+T("All courses","সব কোর্স")+'</h2><p class="sub">'+T("Try a free course first. No payment needed.","আগে একটি ফ্রি কোর্স করে দেখুন। কোনো পেমেন্ট লাগবে না।")+'</p><div class="flt">'+b.map(function(x){return '<button data-a="f" data-f="'+x[0]+'" class="'+(flt===x[0]?"on":"")+'">'+T(x[1],x[2])+'</button>';}).join("")+'</div><div class="g">'+f.map(card).join("")+'</div></div></section>';}
function about(){return '<section><div class="wrap pg"><h2>'+T("About Sohoz Learning","সহজ লার্নিং সম্পর্কে")+'</h2><p>'+T("Sohoz means easy. We make learning simple for everyone in Bangladesh, in Bangla and English, with free courses to start and paid courses to go further.","‘সহজ’ মানে সহজ। আমরা বাংলাদেশের সবার জন্য শেখা সহজ করি—বাংলা ও ইংরেজিতে, শুরুর জন্য ফ্রি কোর্স আর আরও এগিয়ে যেতে পেইড কোর্স।")+'</p></div></section>';}
function contact(){return '<section><div class="wrap pg"><h2>'+T("Contact us","যোগাযোগ")+'</h2><p>'+T("Questions about a course or payment? Write to us.","কোর্স বা পেমেন্ট নিয়ে প্রশ্ন? আমাদের লিখুন।")+'</p><p><b>Email:</b> support@sohozlearning.com<br><b>WhatsApp:</b> 01XXX-XXXXXX</p></div></section>';}
function authHTML(){if(pay)return payHTML();var l=mode==="login";
return '<button class="x" data-a="close" aria-label="Close">✕</button><div class="tabs"><button data-a="login" class="'+(l?"on":"")+'">'+T("Log in","লগইন")+'</button><button data-a="signup" class="'+(l?"":"on")+'">'+T("Sign up","সাইন আপ")+'</button></div>'+(l?"":'<label>'+T("Name","নাম")+'<input autocomplete="name"></label>')+'<label>'+T("Email","ইমেইল")+'<input type="email" autocomplete="email"></label><label>'+T("Password","পাসওয়ার্ড")+'<input type="password" autocomplete="current-password"></label><button class="btn" style="width:100%" data-a="submit">'+(l?T("Log in","লগইন করুন"):T("Create account","অ্যাকাউন্ট খুলুন"))+'</button><p id="msg"></p>';}
function render(){
var v=view(),nav=[["home","Home","হোম"],["courses","Courses","কোর্স"],["about","About","আমাদের সম্পর্কে"],["contact","Contact","যোগাযোগ"]];
document.documentElement.lang=lang;if(user)nav.push(["dashboard","My Courses","আমার কোর্স"]);
document.title=T("Sohoz Learning","সহজ লার্নিং");
document.getElementById("hdr").innerHTML='<a class="logo" href="#home">Sohoz<b>Learning</b></a><button class="burger" data-a="menu" aria-label="Menu" aria-expanded="'+open+'">☰</button><div id="menu" class="'+(open?"open":"")+'"><nav>'+nav.map(function(n){return '<a href="#'+n[0]+'"'+(v===n[0]?' aria-current="page"':"")+'>'+T(n[1],n[2])+'</a>';}).join("")+'</nav><div class="act"><button class="lang" data-a="lang">'+T("বাংলা","English")+'</button>'+(user?'<button class="ghost" data-a="logout">'+T("Log out","লগআউট")+'</button>':'<button class="ghost" data-a="login">'+T("Log in","লগইন")+'</button><button class="btn" data-a="signup">'+T("Sign up","সাইন আপ")+'</button>')+'</div></div>';
document.getElementById("main").innerHTML={home:home,courses:courses,about:about,contact:contact,dashboard:dashboard}[v]();
document.getElementById("ftr").innerHTML='<div class="fg"><div><a class="logo" href="#home">Sohoz<b>Learning</b></a><p>'+T("Easy online learning in Bangla and English.","বাংলা ও ইংরেজিতে সহজ অনলাইন শিক্ষা।")+'</p><p>'+T("Pay with bKash, Nagad or card.","বিকাশ, নগদ বা কার্ডে পেমেন্ট।")+'</p></div><div><h4>'+T("Learn","শিখুন")+'</h4><ul><li><a href="#courses">'+T("All courses","সব কোর্স")+'</a></li><li><a href="#courses">'+T("Free courses","ফ্রি কোর্স")+'</a></li></ul></div><div><h4>'+T("Company","কোম্পানি")+'</h4><ul><li><a href="#about">'+T("About us","আমাদের সম্পর্কে")+'</a></li><li><a href="#contact">'+T("Contact","যোগাযোগ")+'</a></li></ul></div><div><h4>'+T("Policies","নীতিমালা")+'</h4><ul><li>'+T("Terms","শর্তাবলী")+'</li><li>'+T("Privacy","গোপনীয়তা")+'</li><li>'+T("Refund","রিফান্ড")+'</li></ul></div></div><div class="cp">© Sohoz Learning · sohozlearning.com</div>';
var d=document.getElementById("dlg");if(!d.open)d.innerHTML=authHTML();
}
function showAuth(){var d=document.getElementById("dlg");d.innerHTML=authHTML();if(!d.open)d.showModal();}
document.addEventListener("click",function(e){
var d=document.getElementById("dlg");
if(e.target===d){d.close();return;}
var el=e.target.closest("[data-a]");if(!el)return;
var a=el.getAttribute("data-a");
if(a==="lang"){lang=lang==="en"?"bn":"en";try{localStorage.setItem("sl-lang",lang);}catch(x){}render();}
else if(a==="menu"){open=!open;render();}
else if(a==="login"||a==="signup"){mode=a;pay=null;open=false;if(!d.open){render();}showAuth();}
else if(a==="close"){d.close();}
else if(a==="f"){flt=el.getAttribute("data-f");render();}
else if(a==="logout"){if(sb)sb.auth.signOut();location.hash="home";}
else if(a==="enroll"){var id=el.getAttribute("data-id");
if(!user){mode="signup";pay=null;showAuth();return;}
var c=norm().filter(function(x){return x.id===id;})[0];if(!c)return;
if(c.price>0){pay=c;showAuth();}
else{sb.from("enrollments").insert({user_id:user.id,course_id:id}).then(function(r){if(!r.error){mine.push(id);location.hash="dashboard";render();}});}}
else if(a==="submit"){doSubmit();}
});
window.addEventListener("hashchange",function(){open=false;render();window.scrollTo(0,0);});
if(sb){
sb.auth.getSession().then(function(r){user=r.data.session?r.data.session.user:null;loadData();});
sb.auth.onAuthStateChange(function(ev,sess){var u=sess?sess.user:null;if((u&&u.id)!==(user&&user.id)){user=u;setTimeout(loadData,0);}});
}
var pq=new URLSearchParams(location.search).get("pay");
if(pq){history.replaceState(null,"",location.pathname+location.hash);setTimeout(function(){alert(pq==="ok"?T("Payment successful! Your course is now open.","পেমেন্ট সফল! আপনার কোর্স এখন খোলা।"):T("Payment was not completed. Please try again.","পেমেন্ট সম্পন্ন হয়নি। আবার চেষ্টা করুন।"));},600);}
render();
})();
</script>
</body>
</html>
